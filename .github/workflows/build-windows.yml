name: Build Windows installer

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

env:
  YTDLP_VERSION: "2026.07.04"
  FFMPEG_URL: "https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"

defaults:
  run:
    shell: pwsh

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          python -m pytest -q
          if ($LASTEXITCODE -ne 0) { throw "tests failed" }

      - name: Download yt-dlp and ffmpeg
        run: |
          New-Item -ItemType Directory -Force -Path bin | Out-Null

          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/download/$env:YTDLP_VERSION/yt-dlp.exe" `
            -OutFile bin\yt-dlp.exe

          $zip = Join-Path $env:RUNNER_TEMP "ffmpeg.zip"
          $out = Join-Path $env:RUNNER_TEMP "ffmpeg"
          Invoke-WebRequest -Uri $env:FFMPEG_URL -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $out -Force
          Get-ChildItem -Path $out -Recurse -Include ffmpeg.exe, ffprobe.exe |
            ForEach-Object { Copy-Item $_.FullName -Destination bin\ -Force }

          Get-ChildItem bin

      - name: Verify downloaded binaries actually run
        run: |
          .\bin\yt-dlp.exe --version
          if ($LASTEXITCODE -ne 0) { throw "yt-dlp did not run" }

          .\bin\ffmpeg.exe -hide_banner -version | Select-Object -First 1
          if ($LASTEXITCODE -ne 0) { throw "ffmpeg did not run" }

          # MP3 export is impossible without an mp3 encoder.
          $encoders = .\bin\ffmpeg.exe -hide_banner -encoders 2>$null
          if (-not ($encoders -match "libmp3lame")) { throw "libmp3lame missing" }
          Write-Host "libmp3lame present"

      - name: Build .exe with PyInstaller
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name ytdlp-gui `
            --collect-all customtkinter `
            src/app.py
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed" }
          Get-Item dist\ytdlp-gui.exe

      - name: Verify ffmpeg can produce the formats the app needs
        # Offline equivalent of the app's two jobs, so this does not depend on
        # YouTube being reachable from a CI IP address.
        run: |
          $out = Join-Path $env:RUNNER_TEMP "encode"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          .\bin\ffmpeg.exe -hide_banner -loglevel error `
            -f lavfi -i testsrc=size=320x240:rate=30:duration=1 `
            -c:v libx264 "$out\v.mp4"
          if ($LASTEXITCODE -ne 0) { throw "h264 encode failed" }

          .\bin\ffmpeg.exe -hide_banner -loglevel error `
            -f lavfi -i sine=frequency=440:duration=1 `
            -c:a libmp3lame "$out\a.mp3"
          if ($LASTEXITCODE -ne 0) { throw "mp3 encode failed" }

          $codec = .\bin\ffprobe.exe -v error -select_streams v:0 `
            -show_entries stream=codec_name -of csv=p=0 "$out\v.mp4"
          if ($codec.Trim() -ne "h264") { throw "expected h264, got $codec" }
          Write-Host "ffmpeg encodes H.264 and MP3 correctly"

      - name: Smoke test - real download through the app's own arguments
        # Non-blocking: YouTube frequently bot-blocks datacenter IPs, which is a
        # CI-network failure rather than a defect in the build.
        continue-on-error: true
        env:
          SMOKE_YTDLP: bin\yt-dlp.exe
          SMOKE_FFMPEG: bin\ffmpeg.exe
          SMOKE_FFPROBE: bin\ffprobe.exe
        run: |
          $env:SMOKE_OUT = Join-Path $env:RUNNER_TEMP "smoke"
          python scripts\smoke_download.py
          if ($LASTEXITCODE -ne 0) { throw "smoke test failed" }

      - name: Build installer
        run: |
          $iscc = Get-ChildItem -Path `
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", `
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe" `
            -ErrorAction SilentlyContinue | Select-Object -First 1

          if (-not $iscc) {
            Write-Host "Inno Setup not present; installing"
            choco install innosetup -y --no-progress
            $iscc = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
              -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $iscc) { throw "ISCC.exe not found" }

          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
          } else {
            $version = "dev-" + $env:GITHUB_SHA.Substring(0, 7)
          }
          Write-Host "Version: $version"

          & $iscc.FullName "/DAppVersion=$version" installer\ytdlp-gui.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

          Get-ChildItem installer\output

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ytdlp-gui-windows-setup
          path: installer/output/*.exe
          if-no-files-found: error

      - name: Attach installer to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/output/*.exe
