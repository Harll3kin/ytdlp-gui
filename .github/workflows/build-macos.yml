name: Build macOS DMG

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

env:
  # yt-dlp_macos is a universal binary (macOS 10.15+), so one file covers both
  # Intel and Apple Silicon. ffmpeg is per-architecture.
  YTDLP_VERSION: "2026.07.04"
  FFMPEG_TAG: "b6.1.1"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: applesilicon
            ffmpeg_asset: ffmpeg-darwin-arm64
            ffprobe_asset: ffprobe-darwin-arm64
          - runner: macos-15-intel
            arch: intel
            ffmpeg_asset: ffmpeg-darwin-x64
            ffprobe_asset: ffprobe-darwin-x64

    runs-on: ${{ matrix.runner }}
    name: build-${{ matrix.arch }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests on macOS
        # Catches macOS-only regressions such as referencing the Windows-only
        # subprocess.CREATE_NO_WINDOW constant.
        run: python -m pytest -q

      - name: Download yt-dlp and ffmpeg binaries
        run: |
          set -euo pipefail
          mkdir -p build_resources

          curl -L --fail --retry 3 --retry-delay 5 \
            "https://github.com/yt-dlp/yt-dlp/releases/download/${YTDLP_VERSION}/yt-dlp_macos" \
            -o build_resources/yt-dlp

          curl -L --fail --retry 3 --retry-delay 5 \
            "https://github.com/eugeneware/ffmpeg-static/releases/download/${FFMPEG_TAG}/${{ matrix.ffmpeg_asset }}" \
            -o build_resources/ffmpeg

          curl -L --fail --retry 3 --retry-delay 5 \
            "https://github.com/eugeneware/ffmpeg-static/releases/download/${FFMPEG_TAG}/${{ matrix.ffprobe_asset }}" \
            -o build_resources/ffprobe

          chmod +x build_resources/*

      - name: Verify downloaded binaries actually run
        run: |
          set -euo pipefail
          echo "--- architecture ---"
          file build_resources/yt-dlp build_resources/ffmpeg

          echo "--- yt-dlp ---"
          ./build_resources/yt-dlp --version

          echo "--- ffmpeg ---"
          ./build_resources/ffmpeg -hide_banner -version | head -1

          # MP3 export is impossible without an mp3 encoder.
          echo "--- mp3 encoder ---"
          ./build_resources/ffmpeg -hide_banner -encoders | grep -q libmp3lame
          echo "libmp3lame present"

      - name: Generate app icon
        run: python generate_icon.py

      - name: Build .app with PyInstaller
        run: |
          set -euo pipefail
          ICON_ARG=""
          if [ -f icon.icns ]; then ICON_ARG="--icon=icon.icns"; fi

          # --onedir (not --onefile): a .app is already a directory, and this
          # avoids re-extracting ~90 MB of binaries on every launch.
          # yt-dlp_macos is itself a PyInstaller onefile binary, with an archive
          # appended past the end of the Mach-O, and it carries its own code
          # signature. Both PyInstaller and codesign rewrite nested executables,
          # which corrupts it ("Could not load PyInstaller's embedded PKG
          # archive"). Shipping it gzipped hides it from that processing; the app
          # unpacks it on first launch.
          gzip -9 -c build_resources/yt-dlp > build_resources/yt-dlp.gz

          pyinstaller --noconfirm --clean --onedir --windowed \
            --name ytdlp-gui \
            $ICON_ARG \
            --collect-all customtkinter \
            --add-data "build_resources/yt-dlp.gz:." \
            --add-binary "build_resources/ffmpeg:." \
            --add-binary "build_resources/ffprobe:." \
            src/app.py

      - name: Ad-hoc code sign
        # arm64 refuses to execute unsigned binaries; an ad-hoc signature is the
        # minimum needed. This is NOT notarization - Gatekeeper will still warn.
        run: |
          set -euo pipefail
          # Deliberately no --deep: it would re-sign the nested yt-dlp and
          # corrupt it. ffmpeg/ffprobe are plain static binaries, so signing
          # them individually is safe and keeps them runnable on arm64.
          for name in ffmpeg ffprobe; do
            bin=$(find dist/ytdlp-gui.app -name "$name" -type f | head -1)
            if [ -n "$bin" ]; then codesign --force --sign - "$bin"; fi
          done

          codesign --force --sign - dist/ytdlp-gui.app
          codesign --verify --verbose dist/ytdlp-gui.app

      - name: Verify bundled binaries inside the .app
        run: |
          set -euo pipefail
          YTDLP_GZ=$(find dist/ytdlp-gui.app -name 'yt-dlp.gz' -type f | head -1)
          FFMPEG_BIN=$(find dist/ytdlp-gui.app -name 'ffmpeg' -type f | head -1)
          FFPROBE_BIN=$(find dist/ytdlp-gui.app -name 'ffprobe' -type f | head -1)

          if [ -z "$YTDLP_GZ" ] || [ -z "$FFMPEG_BIN" ] || [ -z "$FFPROBE_BIN" ]; then
            echo "Bundled payloads missing from the app bundle"
            find dist/ytdlp-gui.app -type f \( -name '*yt-dlp*' -o -name '*ffmpeg*' -o -name '*ffprobe*' \)
            exit 1
          fi

          echo "yt-dlp payload at: $YTDLP_GZ"
          echo "ffmpeg bundled at: $FFMPEG_BIN"

          # Unpack exactly the way the app does at first launch.
          STAGE=$(mktemp -d)
          gunzip -c "$YTDLP_GZ" > "$STAGE/yt-dlp"
          chmod +x "$STAGE/yt-dlp"

          # Byte-identical or the embedded archive and code signature are broken,
          # which only surfaces at runtime on the user's machine.
          EXPECTED=$(shasum -a 256 build_resources/yt-dlp | awk '{print $1}')
          ACTUAL=$(shasum -a 256 "$STAGE/yt-dlp" | awk '{print $1}')
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "Unpacked yt-dlp differs from the downloaded binary."
            echo "  expected $EXPECTED"
            echo "  actual   $ACTUAL"
            exit 1
          fi
          echo "yt-dlp survives packaging byte-for-byte"

          "$STAGE/yt-dlp" --version
          "$FFMPEG_BIN" -hide_banner -version | head -1

          echo "YTDLP_BIN=$STAGE/yt-dlp" >> "$GITHUB_ENV"
          echo "FFMPEG_BIN=$FFMPEG_BIN" >> "$GITHUB_ENV"
          echo "FFPROBE_BIN=$FFPROBE_BIN" >> "$GITHUB_ENV"

      - name: Verify ffmpeg can produce the formats the app needs
        # Offline equivalent of the app's two jobs, so the guarantee does not
        # depend on YouTube being reachable from a CI IP address.
        run: |
          set -euo pipefail
          OUT=$(mktemp -d)

          "$FFMPEG_BIN" -hide_banner -loglevel error \
            -f lavfi -i testsrc=size=320x240:rate=30:duration=1 \
            -c:v libx264 "$OUT/v.mp4"
          "$FFMPEG_BIN" -hide_banner -loglevel error \
            -f lavfi -i sine=frequency=440:duration=1 \
            -c:a libmp3lame "$OUT/a.mp3"

          CODEC=$("$FFPROBE_BIN" -v error -select_streams v:0 \
            -show_entries stream=codec_name -of csv=p=0 "$OUT/v.mp4")
          test "$CODEC" = "h264" || { echo "expected h264, got $CODEC"; exit 1; }
          test -s "$OUT/a.mp3" || { echo "mp3 not produced"; exit 1; }
          echo "ffmpeg encodes H.264 and MP3 correctly"

      - name: Smoke test - real download in H.264 and MP3
        # Non-blocking: YouTube frequently bot-blocks datacenter IPs, which
        # would be a CI-network failure rather than a defect in the build.
        continue-on-error: true
        run: |
          set -euo pipefail
          export SMOKE_YTDLP="$YTDLP_BIN"
          export SMOKE_FFMPEG="$FFMPEG_BIN"
          export SMOKE_FFPROBE="$FFPROBE_BIN"
          export SMOKE_OUT=$(mktemp -d)
          python scripts/smoke_download.py

      - name: Create DMG
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/tags/*) VERSION="${GITHUB_REF_NAME#v}" ;;
            *) VERSION="dev-$(git rev-parse --short HEAD)" ;;
          esac

          DMG_NAME="ytdlp-gui-${VERSION}-macos-${{ matrix.arch }}.dmg"
          STAGE=$(mktemp -d)

          cp -R dist/ytdlp-gui.app "$STAGE/"
          # Drop target so the user can drag the app straight into Applications.
          ln -s /Applications "$STAGE/Applications"

          mkdir -p out

          # hdiutil intermittently fails with "Resource busy" on the hosted
          # runners, usually while Spotlight is still indexing the staged copy.
          for tentativa in 1 2 3 4 5; do
            if hdiutil create \
                 -volname "yt-dlp GUI" \
                 -srcfolder "$STAGE" \
                 -ov -format UDZO \
                 "out/$DMG_NAME"; then
              break
            fi
            if [ "$tentativa" -eq 5 ]; then
              echo "hdiutil still failing after $tentativa attempts"
              exit 1
            fi
            echo "hdiutil attempt $tentativa failed; retrying in 10s"
            hdiutil detach "/Volumes/yt-dlp GUI" -force 2>/dev/null || true
            sleep 10
          done

          echo "DMG_NAME=$DMG_NAME" >> "$GITHUB_ENV"
          ls -lh "out/$DMG_NAME"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: ytdlp-gui-macos-${{ matrix.arch }}
          path: out/*.dmg
          if-no-files-found: error

      - name: Attach DMG to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.dmg
          body: |
            macOS build of yt-dlp GUI.

            - `macos-applesilicon` for M1/M2/M3/M4 Macs
            - `macos-intel` for Intel Macs

            The app is not notarized. On first launch macOS will block it:
            open **System Settings > Privacy & Security**, scroll down and
            click **Open Anyway**.
